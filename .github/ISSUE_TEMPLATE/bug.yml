name: Bug report
description: Report an observable gateway failure or regression.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What client, method, SLO, or operator workflow is affected?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use mock endpoints and remove credentials or signed transaction data.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include versions, request IDs, metrics, or trace observations without secrets.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed endpoint credentials, API keys, and signed transaction payloads.
          required: true
